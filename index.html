<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studyline IA — Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Superior Estilo Render & Apple Toolbar -->
  <header class="render-header">
    <div class="render-header-container">
      <div class="render-brand">
        <div class="render-logo-icon">✦</div>
        <div class="render-brand-text">
          <span class="brand-name">Studyline IA</span>
          <span class="brand-divider">/</span>
          <span class="topic-breadcrumb" id="topTopicSubtitle">Workspace principal</span>
        </div>
      </div>

      <div class="render-nav-center">
        <button class="nav-tab-btn active" data-module="summary">Resumen</button>
        <button class="nav-tab-btn" data-module="cards">Tarjetas</button>
        <button class="nav-tab-btn" data-module="quiz">Cuestionario</button>
        <button class="nav-tab-btn" data-module="oral">Examen Oral</button>
      </div>

      <div class="render-header-actions">
        <button class="secret-vlss-btn" id="secretVlssBtn" title="Modo Concentración">⚡ VLSS55</button>
        <button class="icon-action-btn" id="themeToggleBtn" title="Cambiar tema">🌙</button>
      </div>
    </div>
  </header>

  <canvas id="matrixCanvas"></canvas>

  <audio id="vlssAudio" loop preload="auto">
    <source src="Another-Medium.mp3" type="audio/mpeg">
  </audio>

  <!-- Layout Principal Estilo Panel de Control -->
  <div class="render-app-layout">
    
    <!-- Sidebar Izquierdo: Historial de Temas -->
    <aside class="render-sidebar">
      <div class="sidebar-header-box">
        <h3>Historial de Temas</h3>
        <span class="badge-pill" id="savedCountBadge">0</span>
      </div>
      <div id="savedTopicsContainer" class="sidebar-topics-list">
        <p class="empty-notice">No hay temas guardados aún.</p>
      </div>
    </aside>

    <!-- Área de Trabajo Principal -->
    <main class="render-main-content">
      
      <!-- Card de Configuración API -->
      <section class="render-panel animate-panel">
        <div class="panel-header">
          <span class="step-badge">1</span>
          <h2>Credenciales y Modelo Gemini</h2>
        </div>
        <div class="api-control-row">
          <input type="password" id="apiKeyInput" placeholder="Pega tu Gemini API Key (AIzaSy...)" />
          <button id="saveKeyBtn" class="render-btn-secondary">Guardar Clave</button>
          <select id="modelSelect">
            <option value="">Cargando modelos...</option>
          </select>
        </div>
        <small id="keyStatus" class="status-small"></small>
      </section>

      <!-- Card de Carga de Contenido y Archivos -->
      <section class="render-panel animate-panel">
        <div class="panel-header">
          <span class="step-badge">2</span>
          <h2>Configuración de Estudio y Recursos</h2>
        </div>
        <div class="form-grid-3">
          <input id="subject" placeholder="Materia (ej. Fisiología Celular)">
          <input id="goal" placeholder="Objetivo (ej. Examen parcial)">
          <select id="depthSelect">
            <option value="rapido">Profundidad: Rápido</option>
            <option value="medio" selected>Profundidad: Medio</option>
            <option value="extenso">Profundidad: Extenso</option>
          </select>
        </div>
        
        <textarea id="text" rows="4" placeholder="Pega aquí tus apuntes, temas o resumen de estudio…"></textarea>
        
        <div class="form-actions-row">
          <div class="file-upload-group">
            <label class="render-file-btn">
              📁 Subir Documento (PDF, Docx)
              <input id="files" type="file" multiple accept=".pdf,.txt,.md,.docx" hidden>
            </label>
            <label class="render-file-btn">
              🖼️ Subir Imágenes
              <input id="imageFiles" type="file" multiple accept="image/*" hidden>
            </label>
          </div>
          <button id="genBtn" class="render-btn-primary">Generar Contenido IA</button>
        </div>

        <div id="filePreviewContainer" class="file-preview-grid"></div>
        <div id="status" class="status-banner"></div>

        <!-- Visor Integrado de Archivos Originales -->
        <div id="activeFileViewer" class="active-file-viewer animate-panel" hidden>
          <div class="viewer-header">
            <span id="viewerTitle" class="viewer-title-text">Visualizador de Material Original</span>
            <button id="closeViewerBtn" class="viewer-close-btn">Cerrar ✕</button>
          </div>
          <div class="viewer-content" id="viewerContentBox"></div>
        </div>
      </section>

      <!-- Card de Resultados / Módulos de Estudio -->
      <section id="resultCard" class="render-panel animate-panel" hidden>
        <div class="result-topbar">
          <h2 id="resultTitle" class="result-main-title">Vista de Estudio</h2>
          <button id="saveTopicBtn" class="render-btn-success">Guardar Tema en Historial</button>
        </div>
        
        <div class="study-header-banner" id="studyBanner" hidden>
          <span class="meta-pill">MÓDULO ACTIVO</span>
          <h2 class="study-title" id="bannerSubject">Materia</h2>
          <p class="study-subtext" id="bannerGoal">Objetivo</p>
        </div>

        <div id="view"></div>
      </section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
